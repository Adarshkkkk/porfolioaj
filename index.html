<style>
:root{--bg:#bfe3ff;--card:#fffdf7;--ink:#2b2a33;--accent:#ff7a3d;--mut:#6b6a75;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2540;--card:#262b40;--ink:#f3efe6;--accent:#ff9a5c;--mut:#aab0c6}}
:root[data-theme="dark"]{--bg:#1d2540;--card:#262b40;--ink:#f3efe6;--accent:#ff9a5c;--mut:#aab0c6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#reader{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:5}
#reader.on{display:flex}
.sheet{background:var(--card);color:var(--ink);width:min(780px,calc(100% - 24px));max-height:calc(100% - 48px);overflow:auto;border-radius:20px;padding:24px 26px;position:relative;line-height:1.5;font-size:15px}
.sheet h1{margin:0;font-size:30px}.sheet h2{color:var(--accent);margin:22px 0 6px;font-size:18px;letter-spacing:.06em;text-transform:uppercase}.sheet h3{margin:14px 0 2px;font-size:16px}.sheet .sub{color:var(--mut);margin:4px 0}.sheet ul{margin:4px 0;padding-left:20px}
.x{position:sticky;top:0;float:right;border:0;border-radius:50%;width:36px;height:36px;font-size:18px;background:var(--accent);color:#1a1a1a;cursor:pointer}
.open{border:0;border-radius:999px;padding:9px 16px;background:var(--accent);color:#1a1a1a;font-weight:bold;cursor:pointer;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:10px}
.m{border-radius:12px;overflow:hidden;aspect-ratio:4/3;box-shadow:0 6px 18px #0003}
.cap{margin:6px 2px 0;font-size:13px;color:var(--mut)}.cap b{color:var(--ink);font-size:15px}
#nav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:14px;right:14px;display:flex;flex-wrap:wrap;gap:8px}
#nav button{border:0;border-radius:999px;padding:8px 14px;font:bold 14px "Trebuchet MS",system-ui,sans-serif;background:var(--card);color:var(--ink);box-shadow:0 3px 10px #0003;cursor:pointer}
#nav button:hover{background:var(--accent);color:#fff}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.chip{background:var(--card);color:var(--ink);border-radius:14px;padding:8px 14px;font-size:14px;box-shadow:0 4px 14px #0003}
.chip b{color:var(--accent)}
#panel{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translate(-50%,30px);width:min(420px,calc(100% - 28px));background:var(--card);color:var(--ink);border-radius:20px;padding:18px 20px;box-shadow:0 10px 30px #0004;opacity:0;pointer-events:none;transition:.25s;max-height:44vh;overflow:auto}
#panel.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#panel h2{margin:0 0 6px;font-size:22px;color:var(--accent)}
#panel p{margin:0 0 10px;line-height:1.45;font-size:15px}
#panel a{color:var(--accent);font-weight:bold;margin-right:12px}
#pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:none;justify-content:space-between;padding:0 18px;pointer-events:none}
#pad div{display:grid;grid-template-columns:repeat(3,56px);gap:6px;pointer-events:auto}
#pad button{height:56px;border:0;border-radius:16px;background:var(--card);color:var(--ink);font-size:22px;box-shadow:0 3px 10px #0003;touch-action:none}
@media (pointer:coarse){#pad{display:flex}}
</style>

const CV=`<h1>Adarsh Jha</h1><p class="sub">Founder | Product Builder | Product &amp; Technology Designer</p><p class="sub">[Phone Number] · [Email Address] · India<br>[Portfolio Website] · [LinkedIn] · [GitHub]</p>
<h2>Profile</h2><p>I’m a multidisciplinary entrepreneur and independent product builder with an interest in understanding how things work, identifying problems and turning ideas into real-world solutions.</p><p>My work sits at the intersection of business, design and technology. I’ve worked on everything from real estate business models and brand identities to manufacturing ERP systems, product design and computing architecture.</p><p>I started exploring and building projects at a young age, learning through experimentation, independent research and hands-on execution rather than following a conventional career path.</p><p>I founded Yodel, a branding and software studio, where I work with businesses to translate ideas into brands, products and digital systems. I’m also developing FRISC, a patent-pending computing architecture built around a simple belief: computing should be elastic, not limited by the hardware we own.</p><p>I’m particularly interested in the space between an idea and its implementation — understanding the problem, designing the solution and figuring out how to make it work.</p>
<h2>Experience</h2><h3>YODEL — Founder</h3><p class="sub">2025 – Present | Branding, Design &amp; Software</p><p>Founded an independent creative and technology studio focused on building brands, digital experiences and business software.</p><ul><li><b>Horizone:</b> brand direction and digital experience for an interior design and architecture consultancy.</li><li><b>SS Cable:</b> designed and developed an ERP for manufacturing operations — procurement, production, inventory and costing.</li><li><b>BeeU Group:</b> packaging design and brand development.</li><li><b>Prowood:</b> brand identity and website design.</li><li><b>Altuva:</b> brand identity and visual development.</li><li><b>Bharat Ka Swaad:</b> brand identity and design development.</li></ul><p><b>What I do:</b> work directly with clients to understand business problems; develop brand identities and creative directions; design digital products and user experiences; translate operational requirements into software; manage projects from research and concept to implementation.</p>
<h3>CLEVER X — Market Researcher</h3><p class="sub">2025</p><p>Market research and business intelligence: market opportunities, consumer insights and business positioning. Conducted research, analysed opportunities and positioning, and built an understanding of research-driven decision-making.</p>
<h3>HOMELY — Entrepreneur</h3><p class="sub">2024 | Real Estate &amp; Property Improvement</p><p>Explored a real estate model focused on improving underperforming rental properties: identify properties with untapped potential, improve their condition and increase their rental value. Identified opportunities, explored upgrades and value-add strategies, and developed a model that achieved nearly 2× rental income.</p>
<h2>Independent projects</h2><h3>FRISC — Founder &amp; Computing Architecture Developer</h3><p class="sub">2026 – Present</p><p>A different way of thinking about personal computing: a device shouldn’t be limited by the hardware physically inside it. <b>Compute should be elastic.</b> The vision is to connect personal devices, local computing infrastructure and remote resources into one distributed environment.</p><ul><li>Distributed computing architecture</li><li>Local and remote compute orchestration</li><li>Phone and PC hardware architecture</li><li>Reducing hardware dependency and electronic waste</li><li>FRISC Runtime development</li><li>RISC-V and virtualised computing research</li></ul>
<h3>FRISC-SRC — Semantic Compression Engine</h3><p>Experimental semantic approaches to data compression and communication: a Python encoder/decoder, semantic packet structures, client-server concepts, compression benchmarks and testing.</p>
<h3>SS CABLE ERP — Manufacturing Software</h3><p>ERP for wire manufacturing connecting business operations with real production workflows: BOM and manufacturing costing, raw material procurement and inventory, work orders and production tracking, WIP and finished goods, process automation and operational reporting.</p>
<h2>Skills &amp; working knowledge</h2><p><b>Business &amp; Strategy:</b> entrepreneurship, market research, product strategy, financial analysis, client management, business process understanding.</p><p><b>Product &amp; Creative:</b> product and industrial design, UX/UI, design thinking, wireframing and prototyping, brand identity, creative direction, packaging, CAD and 3D product design.</p><p><b>Technology:</b> Python, Java, HTML/CSS/JavaScript, Git and GitHub, REST APIs, ERP systems, PCB and embedded fundamentals, software and systems architecture.</p><p><b>Interests:</b> AI, distributed computing, cloud and edge computing, sustainable technology, computer architecture, RISC-V.</p>
<h2>Education</h2><p>Higher Secondary (Class XII), 2021 — 85%<br>Secondary (Class X), 2019 — 85%</p>
<h2>Beyond the resume</h2><p>I enjoy working across disciplines, learning unfamiliar technologies and building things from scratch. My interests span product design, computing, business, gaming, animation, hardware and software.</p><p>I believe good ideas should not remain ideas. They should be questioned, prototyped, tested and eventually built.</p><p><b>Understand the system. Question the limitations. Build something better.</b></p>`;
